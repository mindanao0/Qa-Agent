[project]
name = "qa-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "playwright>=1.50.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "lancedb>=0.13.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "jellyfish>=1.1.0",
    "rank-bm25>=0.2.2",
    "allure-pytest>=2.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.2",
    "opentelemetry-sdk>=1.25.0",
    "filelock>=3.16.0",
    "aiofiles>=24.1.0",
    "rich>=13.9.0",
    "openai>=1.51.0",
    "instructor>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "sentence-transformers>=5.5.1",
    "defusedxml>=0.7.1",
    "lxml>=6.1.1",
    "tiktoken>=0.13.0",
    "jsonschema>=4.26.0",
    "pyarrow>=24.0.0",
    "opentelemetry-api>=1.42.1",
    "langchain-ollama>=1.1.0",
    "psutil>=7.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "genson>=1.3.0",
    "hypothesis>=6.155.1",
]

[project.optional-dependencies]
finetune = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    "unsloth[colab-new]>=2024.12.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]
xformers = [{ index = "pytorch-cu124" }]

[project.scripts]
qa-agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ""
markers = [
    "integration: marks tests as integration tests (require live Ollama)",
]

[tool.uv]
# transformers 5.x needs torch>=2.8, but this venv is pinned to the cu124 index
# (torch 2.6) — unconstrained resolution installed transformers 5.5.0 and broke
# every import through sentence-transformers (pytest could not even collect).
constraint-dependencies = ["transformers<5"]

[tool.uv.extra-build-dependencies]
xformers = ["torch"]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest-timeout>=2.4.0",
]
