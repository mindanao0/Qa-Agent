[project]
name = "qa-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "lancedb>=0.13.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "jellyfish>=1.1.0",
    "rank-bm25>=0.2.2",
    "allure-pytest>=2.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.2",
    "opentelemetry-sdk>=1.25.0",
    "filelock>=3.16.0",
    "aiofiles>=24.1.0",
    "rich>=13.9.0",
    "openai>=1.51.0",
    "instructor>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "sentence-transformers>=5.5.1",
    "defusedxml>=0.7.1",
    "lxml>=6.1.1",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
finetune = [
    "unsloth[colab-new]>=2024.12.0",
]

[project.scripts]
qa-agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ""
markers = [
    "integration: marks tests as integration tests (require live Ollama)",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
