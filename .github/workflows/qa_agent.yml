# Sprint 8 QA Agent CI Pipeline
# 4 stages: lint -> test-unit -> test-e2e -> report
# runs-on: ubuntu-latest | Python: 3.11 (uv managed)
# Ollama service on port 11434 with qwen2.5-coder:7b-instruct-q4_K_M

name: qa-agent CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: qa-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: ruff check
        run: uv run ruff check src/ audit/

      - name: pyright
        run: uv run pyright src/ --pythonversion 3.11 || true

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv pip install -e "." --system

      - name: Run unit tests
        # Covers every suite that runs without live Ollama, a browser, or a
        # training dataset. Was tests/unit + tests/observability only (25 of the
        # repo's 628 collected tests, ~4%); this raises the gate to ~403.
        #
        # Not included, deliberately:
        #   tests/*.py (root)  — need live Ollama / Chromium; test-e2e covers them
        #   tests/finetune     — hard-require data/training/train.jsonl, gitignored
        #   ci/tests           — outside pytest testpaths, needs ci/conftest_ci.py
        # The two deselected cases spawn nested `uv run pytest` subprocesses,
        # which re-resolve the whole project (incl. the CUDA torch wheel) inside
        # the job; test-e2e is the right place for them.
        run: |
          uv run pytest \
            tests/unit tests/observability tests/codetest tests/continuous \
            tests/explorer tests/fuzzer tests/parallel tests/pbt tests/race \
            tests/universal_qa \
            --deselect tests/codetest/test_executor.py::test_executor_passes_simple_test \
            --deselect tests/pbt/test_hypothesis_runner.py::test_run_finds_real_counterexample_and_passes_holding \
            -v --tb=short --timeout=120

  test-e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    # Sprint 6's live gate serializes ~17 generate+judge LLM calls through a
    # Semaphore(1) on CPU-only Ollama (no GPU on ubuntu-latest). Each call is
    # now bounded (~30-80s observed, generation length capped — see the
    # instructor_client.py max_tokens fix) but the total still doesn't fit in
    # 20 min: 17 funcs x up to 2 calls each x ~80s worst-case is ~45 min with
    # margin. Was 20 before this bump; that value came from before Sprint 6/7
    # existed and was never revisited.
    timeout-minutes: 45
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install dependencies
        run: uv pip install -e "." --system

      - name: Install Playwright browsers
        run: uv run playwright install chromium

      - name: Pull Ollama model
        run: |
          curl -s http://localhost:11434/api/pull -d '{"name":"qwen2.5-coder:7b-instruct-q4_K_M"}' &
          sleep 30

      - name: Run Sprint 7 gates
        run: uv run python audit/sprint7/measure_sprint7.py --live
        continue-on-error: true

      - name: Run Sprint 6 gates
        run: uv run python audit/sprint6/measure_sprint6.py --live
        continue-on-error: true

  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test-unit, test-e2e]
    if: always()
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e "." --system

      - name: Generate CI report
        run: uv run python audit/ci/generate_report.py

      - name: Upload sprint results
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: sprint-results-${{ github.run_id }}
          path: audit/sprint*/*_results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload CI report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ci-report-${{ github.run_id }}
          path: audit/ci/
          if-no-files-found: warn
          retention-days: 30

      - name: Post summary
        if: always()
        run: |
          echo "## QA Agent CI Report" >> $GITHUB_STEP_SUMMARY
          if [ -f audit/ci/full_report.md ]; then
            cat audit/ci/full_report.md >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Audit chain:** $(cat audit/ci/audit_verify.txt 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
